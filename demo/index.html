<!doctype html>
<html lang="en" class="theme-dark" data-dc-base="../">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord Compressor demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #313338;
        color: #dbdee1;
        font: 400 15px/1.35 "gg sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      }
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 32px clamp(20px, 6vw, 72px);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      p { margin: 0 0 28px; color: #949ba4; font-size: 14px; max-width: 54ch; }
      ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
      li {
        font-size: 13px;
        color: #b5bac1;
        padding: 8px 10px;
        border-radius: 6px;
        background: #2b2d31;
      }
      .composerWrap { padding: 0 16px 24px; }
      .channelTextArea_f75fb0 { padding: 0 16px; }
      .scrollableContainer__74017 {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        min-height: 44px;
        border-radius: 8px;
        background: #383a40;
      }
      .attachWrapper__0923f { display: flex; }
      .attachButton {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #b5bac1;
        color: #313338;
        font: 500 20px/1 "gg sans", Arial, sans-serif;
        cursor: pointer;
      }
      .attachButton:active { transform: scale(0.97); }
      .textArea__74017 { flex: 1; min-width: 0; }
      .markup__75297 {
        min-height: 24px;
        padding: 10px 0;
        color: #dbdee1;
        font-size: 15px;
        line-height: 1.3;
        outline: none;
      }
      .markup__75297:empty::before { content: attr(data-placeholder); color: #6d6f78; }
      .send {
        border: 0;
        border-radius: 6px;
        padding: 8px 12px;
        background: #5865f2;
        color: #fff;
        font: 500 13px/1 "gg sans", Arial, sans-serif;
        cursor: pointer;
      }
      .send:active { transform: scale(0.97); }
      .note { margin-top: 18px; color: #6d6f78; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Discord Compressor</h1>
      <p>Attach a video or image over 20 MB. The status bar appears above the composer while it shrinks, then the file lands in the message.</p>
      <ul id="attachments"></ul>
      <div class="note" id="note"></div>
    </main>
    <div class="composerWrap">
      <div class="channelTextArea_f75fb0 channelTextArea__74017">
        <div class="scrollableContainer__74017" id="composer">
          <div class="uploadInput__0923f">
            <input class="file-input" type="file" id="file" multiple hidden />
          </div>
          <div class="attachWrapper__0923f">
            <button class="attachButton" type="button" id="attach" aria-label="Attach file">+</button>
          </div>
          <div class="textArea__74017">
            <div
              class="markup__75297"
              role="textbox"
              data-slate-editor="true"
              contenteditable="true"
              data-placeholder="Message #general"
              aria-label="Message #general"
            ></div>
          </div>
          <button class="send" type="button">Send</button>
        </div>
      </div>
    </div>
    <script>
      const input = document.getElementById("file");
      const list = document.getElementById("attachments");
      const note = document.getElementById("note");
      const composer = document.getElementById("composer");
      window.__files = [];
      window.__events = [];
      function record(files) {
        for (const file of files) {
          window.__files.push(file);
          window.__events.push({ name: file.name, size: file.size, type: file.type });
          const item = document.createElement("li");
          item.dataset.name = file.name;
          item.dataset.size = String(file.size);
          item.textContent = `${file.name} — ${(file.size / 1048576).toFixed(2)} MB`;
          list.append(item);
        }
        note.textContent = `${window.__files.length} attachment${window.__files.length === 1 ? "" : "s"} received`;
      }
      document.getElementById("attach").addEventListener("click", () => input.click());
      input.addEventListener("change", () => {
        record(input.files);
        input.value = "";
      });
      composer.addEventListener("dragover", (event) => event.preventDefault());
      composer.addEventListener("drop", (event) => {
        event.preventDefault();
        record(event.dataTransfer.files);
      });
      if (!location.hostname.endsWith("discord.com")) {
        const script = document.createElement("script");
        script.src = "../page.js";
        document.body.append(script);
      }
    </script>
  </body>
</html>
